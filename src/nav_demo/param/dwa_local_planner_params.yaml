DWAPlannerROS:
  # 恢复行为配置
  recovery_behavior_enabled: true
  clearing_rotation_allowed: false

  # 恢复行为列表
  recovery_behaviors:
    - name: 'conservative_reset'
      type: 'clear_costmap_recovery/ClearCostmapRecovery'
    - name: 'aggressive_reset'
      type: 'clear_costmap_recovery/ClearCostmapRecovery'
    - name: 'rotate_recovery'
      type: 'rotate_recovery/RotateRecovery'

  conservative_reset:
    reset_distance: 3.0
    layer_names: ["obstacle"]

  aggressive_reset:
    reset_distance: 0.0
    layer_names: ["obstacle"]

  rotate_recovery:
    max_rotational_vel: 1.0          # 从 0.5 提升到 1.0，加快旋转恢复速度
    min_rotational_vel: 0.1
    acc_lim_th: 1.57                 # 从 1.0 提升到 1.57
    angle_to_rotate: 1.57

  # 机器人加速度限制 - 适度提升
  acc_lim_x: 1.0                     # 从 0.5 提升到 1.0，加速更快
  acc_lim_y: 0.0
  acc_lim_th: 1.57                   # 从 1.0 提升到 1.57，旋转加速更快

  # 速度限制 - 主要调整这里
  max_vel_trans: 0.5                 # 从 0.25 提升到 0.5，前进速度加倍
  min_vel_trans: 0.1
  max_vel_x: 0.5                     # 从 0.25 提升到 0.5
  min_vel_x: -0.5                    # 从 -0.25 提升到 -0.5
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_theta: 1.0                 # 从 0.5 提升到 1.0，旋转速度加倍
  min_vel_theta: 0.1                 # 从 0.05 提升到 0.1

  # 目标容差
  yaw_goal_tolerance: 0.25
  xy_goal_tolerance: 0.15
  latch_xy_goal_tolerance: false

  # 前向模拟参数 - 微调以配合新速度
  sim_time: 1.0                      # 从 1.2 降低到 1.0，规划更快
  sim_granularity: 0.025             # 从 0.03 降低到 0.025，更精细
  vx_samples: 20                     # 从 15 增加到 20，探索更多速度选项
  vy_samples: 0
  vth_samples: 40                    # 从 30 增加到 40，探索更多旋转速度选项

  # 轨迹评分参数
  path_distance_bias: 20.0           # 从 25.0 降低到 20.0，让目标导向更强
  goal_distance_bias: 20.0           # 从 15.0 提升到 20.0，更积极向目标前进
  occdist_scale: 0.05
  forward_point_distance: 0.4        # 从 0.3 提升到 0.4，看得更远
  stop_time_buffer: 0.2              # 从 0.3 降低到 0.2，停止更快
  scaling_speed: 0.25                # 从 0.15 提升到 0.25
  max_scaling_factor: 0.2            # 从 0.15 提升到 0.2
  publish_cost_grid: false

  # 振荡预防
  oscillation_reset_dist: 0.1

  # 全局路径参数
  prune_plan: true

  # 关键参数：机器人类型
  holonomic_robot: false
