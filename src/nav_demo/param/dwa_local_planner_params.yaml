DWAPlannerROS:
  # 恢复行为配置
  recovery_behavior_enabled: true
  clearing_rotation_allowed: false

  # 恢复行为列表
  recovery_behaviors:
    - name: 'conservative_reset'
      type: 'clear_costmap_recovery/ClearCostmapRecovery'
    - name: 'aggressive_reset'
      type: 'clear_costmap_recovery/ClearCostmapRecovery'
    - name: 'rotate_recovery'
      type: 'rotate_recovery/RotateRecovery'

  conservative_reset:
    reset_distance: 3.0
    layer_names: ["obstacle"]

  aggressive_reset:
    reset_distance: 0.0
    layer_names: ["obstacle"]

  rotate_recovery:
    max_rotational_vel: 0.5
    min_rotational_vel: 0.1
    acc_lim_th: 1.0
    angle_to_rotate: 1.57

  # 机器人加速度限制
  acc_lim_x: 1.0  # 降低加速度限制，使运动更平滑
  acc_lim_y: 0.0
  acc_lim_th: 1.5  # 降低角加速度限制

  # 速度限制
  max_vel_trans: 0.3  # 降低最大平移速度
  min_vel_trans: 0.1
  max_vel_x: 0.3
  min_vel_x: 0.0                    # 不允许倒车（之前 11->9 会倒着走）
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_theta: 0.6  # 降低最大角速度
  min_vel_theta: 0.1

  # 目标容差
  yaw_goal_tolerance: 0.15
  xy_goal_tolerance: 0.08
  latch_xy_goal_tolerance: false

  # 前向模拟参数
  sim_time: 1.5  # 减少模拟时间，使规划更即时
  sim_granularity: 0.025
  vx_samples: 20
  vy_samples: 0
  vth_samples: 40  # 增加角速度采样，使转向更平滑

  # 轨迹评分参数
  path_distance_bias: 32.0
  goal_distance_bias: 20.0
  occdist_scale: 0.1  # 降低障碍物代价的权重，避免过于避障
  forward_point_distance: 0.325
  stop_time_buffer: 0.2
  scaling_speed: 0.2
  max_scaling_factor: 0.2
  publish_cost_grid: false

  # 振荡预防
  oscillation_reset_dist: 0.05

  # 全局路径参数
  prune_plan: true

  # 关键参数：机器人类型
  holonomic_robot: false            # 平移交给巡航脚本直接发 linear.y，DWA 保持非全向

  # tf参数：增加容错时间
  transform_tolerance: 1.0
