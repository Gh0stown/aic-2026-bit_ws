# 一键终端里要启动的视觉节点，每行：<脚本名> [解释器]
# 解释器：venv（默认，~/baidu-aip-env）或 system（/usr/bin/python3）或绝对路径。
# 脚本名在 ~/AI视觉、bit_ws/src/photo_capture/scripts、bit_ws/src/nav_demo/scripts
# 下按顺序查找。
#
# inspection_vision 必须用 system python3：
#   系统环境才有 lap（ebike 视频计数）、hyperlpr3（车牌 OCR 兜底）、pyserial（红外串口）；
#   venv 里没有这些包，count_video 会直接返回“缺少 lap”。
# 也可以用环境变量 VISION_NODES="a b" 临时覆盖。
inspection_vision system
